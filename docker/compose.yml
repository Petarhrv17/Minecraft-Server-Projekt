services:
  database:
    image: mariadb:10.11
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "reviactyl"
      MYSQL_USER: "reviactyl"
      MYSQL_PASSWORD: "reviactyl_secret_password"
      MYSQL_ROOT_PASSWORD: "reviactyl_root_password"
    ports:
      - "3306:3306"
    networks:
      - default
      - reviactyl_nw

  panel:
    build: .
    image: reviactyl-panel-custom:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - panel_var:/app/var/
      - panel_logs:/var/log/panel
    environment:
      APP_URL: "http://100.78.139.48"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_TIMEZONE: "Europe/Berlin"
      APP_SERVICE_AUTHOR: "admin@localhost"
      DB_CONNECTION: "mysql"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: "reviactyl"
      DB_USERNAME: "reviactyl"
      DB_PASSWORD: "reviactyl_secret_password"
      CACHE_STORE: "file"
      CACHE_DRIVER: "file"
      SESSION_DRIVER: "file"
      QUEUE_CONNECTION: "database"
    depends_on:
      - database
    networks:
      - default

  agent:
    image: ghcr.io/reviactyl/agent:latest
    restart: always
    ports:
      - "8080:8080"
      - "2022:2022"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./agent_config:/etc/reviactyl"
      - "/var/lib/reviactyl:/var/lib/reviactyl"
      - "/var/log/reviactyl:/var/log/reviactyl"
      - "/tmp/reviactyl:/tmp/reviactyl"
      - "/run/agent:/run/agent"
    depends_on:
      - panel
    networks:
      - default

volumes:
  mariadb_data:
  panel_var:
  panel_logs:

networks:
  default:
    ipam:
      config:
        - subnet: 10.200.0.0/16
  reviactyl_nw:
    external: true
